<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boutique démo : T-shirt en coton</title>
<meta name="robots" content="noindex">
<style>
  /* Thème volontairement « marchand » : police à empattements, couleurs propres.
     Le widget doit s'y fondre sans que ce CSS ne l'abîme. */
  body { margin: 0; font-family: Georgia, "Times New Roman", serif; color: #222; background: #faf8f4; }
  header { padding: 16px 24px; border-bottom: 1px solid #e4dfd5; font-size: 20px; letter-spacing: .08em; text-transform: uppercase; }
  main { max-width: 960px; margin: 32px auto; padding: 0 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
  .photo { aspect-ratio: 4/5; background: #e9e4da; display: grid; place-items: center; color: #8a8273; }
  h1 { margin: 0 0 8px; font-weight: normal; }
  .price { font-size: 20px; margin: 0 0 24px; }
  label { display: block; margin-bottom: 6px; }
  select, button { font: inherit; }
  select { width: 100%; padding: 10px; margin-bottom: 16px; }
  /* Règle agressive comme on en croise sur WooCommerce : elle ne doit pas atteindre le bouton SwiftStyle. */
  button { background: #7a1f2b !important; color: #fff; border: 0; padding: 14px; width: 100%; text-transform: uppercase; }
  .demo-note { margin-top: 32px; padding: 12px 14px; border-left: 3px solid #c9bfae; font-size: 14px; color: #5b5448; }
  .switch { margin-top: 12px; font-size: 14px; }
  @media (max-width: 720px) { main { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>Boutique démo</header>
<main>
  <div class="photo" aria-hidden="true">Photo du produit</div>
  <div>
    <h1 id="title">T-shirt en coton</h1>
    <p class="price">29,00 €</p>

    <form action="/cart/add" method="post" id="product-form">
      <label for="size">Taille</label>
      <select id="size" name="size">
        <option value="">Choisir une taille</option>
        <option>XS</option><option>S</option><option>M</option><option>L</option><option>XL</option><option>XXL</option>
      </select>
      <button type="submit">Ajouter au panier</button>
    </form>

    <!-- Snippet SwiftStyle, tel qu'un marchand le colle (ARCHITECTURE-TECHNIQUE.md § 7.3) -->
    <div id="swiftstyle-root" data-product-id="demo-tee"></div>
<script>
  // Change de produit sans dupliquer la page, avant que le script du widget ne lise data-product-id.
  // L'ajout au panier est simulé.
  (function () {
    var titles = { "demo-tee": "T-shirt en coton", "demo-jean": "Jean droit", "demo-veste": "Veste en laine" };
    var id = new URLSearchParams(location.search).get("p");
    if (titles[id]) {
      document.getElementById("swiftstyle-root").dataset.productId = id;
      document.getElementById("title").textContent = titles[id];
      document.title = "Boutique démo : " + titles[id];
    }
    document.getElementById("product-form").addEventListener("submit", function (e) {
      e.preventDefault();
      var size = document.getElementById("size").value;
      e.submitter.textContent = size ? "Ajouté en " + size + " (démo)" : "Choisissez une taille";
    });
  })();
</script>
    <script src="/v1/widget.js" data-shop-key="pk_demo_boutique" async></script>

    <p class="switch">Autres produits de démo :
      <a href="?p=demo-tee">t-shirt</a>, <a href="?p=demo-jean">jean</a>, <a href="?p=demo-veste">veste</a>
    </p>

    <p class="demo-note">Page de démonstration. La boutique, ses guides des tailles et les vêtements de référence sont fictifs ; la recommandation applique une règle de calcul, sans données réelles derrière.</p>
  </div>
</main>
</body>
</html>
